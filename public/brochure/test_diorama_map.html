<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Manaure 3D Diorama Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html, #map { width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
  
  /* --- Marcadores 3D Anti-Colisión con Alturas Escalonadas --- */
  .diorama-marker {
    cursor: pointer;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: bottom center;
    transition: transform .25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(0 8px 18px rgba(0,0,0,0.45));
  }
  .diorama-marker:hover, .diorama-marker.active {
    transform: scale(1.15) translateY(-6px);
    z-index: 100 !important;
  }
  .diorama-badge {
    background: #FFFFFF;
    border-radius: 999px;
    padding: 3px 10px 3px 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 2px solid #C5A059;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    white-space: nowrap;
    transition: all .2s ease;
  }
  .diorama-marker.active .diorama-badge {
    border-color: #E8830C;
    background: #FFFDF8;
    box-shadow: 0 0 0 3px rgba(232, 131, 12, 0.4), 0 8px 20px rgba(0,0,0,0.35);
  }
  .diorama-icon-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #F4F7F5;
    border: 1.5px solid #C5A059;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .diorama-marker.active .diorama-icon-circle {
    border-color: #E8830C;
    transform: scale(1.1);
  }
  .diorama-title {
    font-size: 11px;
    font-weight: 700;
    color: #0F3D2A;
    letter-spacing: -0.01em;
  }
  .diorama-stem {
    width: 2.5px;
    background: linear-gradient(to bottom, #C5A059, rgba(15, 61, 42, 0.8));
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
  }
  .diorama-pin {
    width: 7px;
    height: 7px;
    background: #E8830C;
    border: 1.5px solid #FFFFFF;
    border-radius: 50%;
    margin-top: -1px;
    box-shadow: 0 0 8px #E8830C;
  }

  /* Escalonamiento de alturas para evitar solapamiento */
  .stem-short .diorama-stem { height: 26px; }
  .stem-med .diorama-stem { height: 50px; }
  .stem-tall .diorama-stem { height: 78px; }
  .stem-xtall .diorama-stem { height: 104px; }

  /* Offset horizontal inteligente */
  .offset-left { transform: translateX(-24px); }
  .offset-right { transform: translateX(24px); }

  /* --- Panel de Información Compacto (NO invasivo, no tapa el mapa) --- */
  #mini-panel {
    position: absolute;
    top: 80px;
    right: 20px;
    width: 310px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    border: 1.5px solid rgba(197, 160, 89, 0.45);
    padding: 16px 18px;
    z-index: 50;
    transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .mini-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .mini-tag {
    font-size: 9.5px;
    font-weight: 800;
    color: #D96B27;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .mini-name {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: #0F3D2A;
    line-height: 1.2;
    margin-top: 2px;
  }
  .mini-desc {
    font-size: 12.5px;
    color: #4A5850;
    line-height: 1.45;
    margin-bottom: 12px;
  }
  .mini-badges {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .mini-badge {
    font-size: 10.5px;
    background: #FAF8F4;
    border: 1px solid #E2D9C3;
    padding: 3px 8px;
    border-radius: 999px;
    color: #0F3D2A;
    font-weight: 600;
  }
  .mini-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: #D96B27;
    color: #FFFFFF;
    font-weight: 700;
    font-size: 12.5px;
    padding: 9px 0;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(217, 107, 39, 0.35);
  }
</style>
</head>
