<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manaure Vive · Mapa 3D Satelital Interactivo</title>

<!-- Mapbox GL JS v3 (Soporte Mapbox 3D con Terreno y Relieve) -->
<script src="https://cdn.jsdelivr.net/npm/mapbox-gl@3.7.0/dist/mapbox-gl.js"></script>
<link href="https://cdn.jsdelivr.net/npm/mapbox-gl@3.7.0/dist/mapbox-gl.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">

<style>
  :root {
    --g: #0F3D2A;
    --gold: #C5A059;
    --or: #E8830C;
    --ink: #17261F;
    --mut: #5C6B62;
    --card: #FFFFFF;
    --ln: rgba(23, 38, 31, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--ink);
    background: #0B1A12;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; }
  #map canvas { cursor: grab; }
  #map:active canvas { cursor: grabbing !important; }

  /* --- Barra de Control Superior Compacta --- */
  #bar {
    position: absolute;
    top: 14px;
    left: 14px;
    max-width: calc(100vw - 28px);
    width: auto;
    z-index: 40;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 16px;
    padding: 8px 14px;
    box-shadow: 0 14px 35px -8px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.85);
    transition: all .25s ease;
  }
  .brand-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 13.5px;
    color: var(--g);
    padding-right: 10px;
    border-right: 1.5px solid var(--ln);
    flex-shrink: 0;
  }
  .brand-chip img {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
  }
  .bar-toggle-btn {
    background: rgba(15, 61, 42, 0.08);
    border: 1px solid var(--ln);
    border-radius: 8px;
    color: var(--g);
    font-size: 11px;
    font-weight: 800;
    padding: 4px 8px;
    cursor: pointer;
    transition: all .2s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 4px;
  }
  .bar-toggle-btn:hover {
    background: var(--g);
    color: #fff;
  }
  .bar-collapsible-content {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  #bar.collapsed {
    padding: 6px 12px;
  }
  #bar.collapsed .bar-collapsible-content {
    display: none !important;
  }
  #bar.collapsed .brand-chip {
    border-right: none;
    padding-right: 0;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  #bar select, #bar button {
    font-family: inherit;
    font-weight: 700;
    font-size: 12.5px;
    border-radius: 10px;
    border: 1.5px solid var(--ln);
    padding: 7px 12px;
    background: #fff;
    cursor: pointer;
    transition: all .2s ease;
    color: var(--ink);
  }
  #bar select:hover, #bar button:hover:not(:disabled) {
    border-color: var(--g);
    background: #FAFCFA;
  }
  #bar select.dest-select {
    border-color: var(--gold);
    background: #FFFCF7;
    color: var(--g);
    font-weight: 800;
  }
  #bar select.dest-select:hover {
    border-color: var(--or);
  }
  #bar button.primary {
    background: var(--or);
    color: #fff;
    border-color: var(--or);
    box-shadow: 0 4px 12px rgba(232, 131, 12, 0.35);
  }
  #bar button.primary:hover:not(:disabled) {
    background: #d47206;
    transform: translateY(-1px);
  }
  #bar button:disabled {
    opacity: .45;
    cursor: not-allowed;
  }
  .voice-wrap, .guia-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
    background: rgba(15, 61, 42, 0.05);
    padding: 5px 10px;
    border-radius: 999px;
  }
  .voice-wrap {
    margin-left: auto;
  }
  .voice-wrap input, .guia-wrap input {
    width: 32px;
    height: 18px;
    appearance: none;
    background: #bbb;
    border-radius: 99px;
    position: relative;
    cursor: pointer;
    transition: .2s;
  }
  .voice-wrap input:checked, .guia-wrap input:checked { background: var(--or); }
  .voice-wrap input::after, .guia-wrap input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    transition: .2s;
  }
  .voice-wrap input:checked::after, .guia-wrap input:checked::after { left: 16px; }

  .btn-back {
    text-decoration: none;
    font-weight: 800;
    font-size: 12.5px;
    color: var(--g);
    padding: 7px 12px;
    border-radius: 10px;
    background: rgba(15, 61, 42, 0.08);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all .2s;
  }
  .btn-back:hover {
    background: var(--g);
    color: #fff;
  }

  /* --- Marcadores 3D con Edificios Isométricos Reales sobre el Terreno --- */
  .landmark-marker {
    cursor: pointer;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform .28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-origin: bottom center;
    position: relative;
    pointer-events: auto !important;
    z-index: 10;
  }
  .landmark-marker:hover, .landmark-marker.active {
    transform: scale(1.1) translateY(-4px);
    z-index: 18 !important;
  }

  /* Etiqueta Flotante sobre el edificio con soporte anti-colisión */
  .landmark-badge-card {
    background: rgba(255, 253, 248, 0.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 999px;
    padding: 3px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--gold);
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    position: relative;
    transition: opacity .25s ease, transform .25s ease, max-height .25s ease;
    white-space: nowrap;
    margin-bottom: -6px;
    z-index: 5;
    pointer-events: none;
    transform-origin: bottom center;
  }
  .landmark-marker:hover .landmark-badge-card,
  .landmark-marker.active .landmark-badge-card {
    border-color: var(--or);
    box-shadow: 0 0 0 3px rgba(232, 131, 12, 0.35), 0 8px 20px rgba(0,0,0,0.45);
    background: #FFFDF8;
  }

  /* Ocultamiento dinámico cuando dos etiquetas colisionan en pantalla */
  .landmark-marker.badge-collapsed .landmark-badge-card {
    opacity: 0 !important;
    pointer-events: none !important;
    transform: scale(0.5) translateY(12px) !important;
    max-height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden !important;
    border: none !important;
    box-shadow: none !important;
  }

  /* El aliado activo siempre tiene prioridad visual absoluta */
  .landmark-marker.active .landmark-badge-card {
    opacity: 1 !important;
    transform: scale(1.05) translateY(-2px) !important;
    pointer-events: auto !important;
    max-height: 80px !important;
    z-index: 19 !important;
  }

  /* Clamping de bordes para evitar corte fuera de pantalla */
  .landmark-marker.edge-left .landmark-badge-card {
    transform-origin: bottom left;
    transform: translateX(35%);
  }
  .landmark-marker.edge-right .landmark-badge-card {
    transform-origin: bottom right;
    transform: translateX(-35%);
  }
  .landmark-marker.edge-top .landmark-badge-card {
    transform: translateY(80px);
  }

  .landmark-labels {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .landmark-sub {
    font-size: 8px;
    font-weight: 800;
    color: var(--mut);
    text-transform: uppercase;
    letter-spacing: .06em;
    line-height: 1;
    margin-bottom: 2px;
  }
  .landmark-title {
    font-family: 'Fraunces', serif;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--g);
    line-height: 1.1;
  }
  .landmark-marker.active .landmark-title {
    color: var(--or);
  }

  /* Escenario del Edificio 3D Isométrico */
  .landmark-diorama-stage {
    position: relative;
    width: clamp(62px, 5.5vw, 92px);
    height: clamp(62px, 5.5vw, 92px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .landmark-diorama-model {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.45));
    transition: transform .28s ease, filter .28s ease;
    pointer-events: none;
    z-index: 2;
  }
  .landmark-marker:hover .landmark-diorama-model,
  .landmark-marker.active .landmark-diorama-model {
    transform: scale(1.08) translateY(-4px);
    filter: drop-shadow(0 18px 24px rgba(232, 131, 12, 0.35)) drop-shadow(0 8px 14px rgba(0, 0, 0, 0.55));
  }

  /* Sombra realista en el terreno */
  .landmark-ground-shadow {
    position: absolute;
    bottom: 8px;
    width: 78%;
    height: 30%;
    background: radial-gradient(ellipse at center, rgba(15, 61, 42, 0.5) 0%, rgba(0,0,0,0.35) 45%, transparent 75%);
    border-radius: 50%;
    transform: rotateX(55deg);
    z-index: 1;
    pointer-events: none;
    transition: all .28s ease;
  }
  .landmark-marker.active .landmark-ground-shadow {
    background: radial-gradient(ellipse at center, rgba(232, 131, 12, 0.55) 0%, rgba(15, 61, 42, 0.38) 45%, transparent 75%);
    transform: rotateX(55deg) scale(1.15);
  }

  /* Anillo base de anclaje geográfico */
  .landmark-anchor-ring {
    position: absolute;
    bottom: 4px;
    width: 18px;
    height: 9px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: rgba(232, 131, 12, 0.3);
    z-index: 0;
    pointer-events: none;
    transition: all .25s ease;
  }
  .landmark-marker.active .landmark-anchor-ring {
    border-color: var(--or);
    box-shadow: 0 0 10px var(--or);
    transform: scale(1.35);
  }

  /* (off-* eliminado: los marcadores nacen centrados en su GPS exacto) */

  /* Modo compacto (zoom alejado): tarjetas optimizadas con categoría + nombre siempre visibles */
  body.compacto .landmark-diorama-stage { width: 46px; height: 46px; }
  body.compacto .landmark-ground-shadow,
  body.compacto .landmark-anchor-ring { display: none; }
  body.compacto .landmark-badge-card { padding: 2px 7px; margin-bottom: -4px; }
  body.compacto .landmark-title { font-size: 10px; line-height: 1.1; }
  body.compacto .landmark-sub {
    font-size: 7px;
    letter-spacing: .04em;
    margin-bottom: 1px;
    display: block;
  }

  /* --- Marcador del Colibrí Volador y Posado Persistente --- */
  .colibri-marker {
    width: 68px;
    height: 68px;
    cursor: pointer;
    user-select: none;
    pointer-events: auto !important;
    z-index: 25 !important;
  }
  .colibri-stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.65));
    transition: transform .2s ease;
  }
  .colibri-aura {
    animation: colibriPulse 2.2s infinite ease-in-out;
  }
  @keyframes colibriPulse {
    0% { transform: scale(0.92); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(0.92); opacity: 0.7; }
  }
  .wing-group {
    transform-box: fill-box;
    transform-origin: 10% 90%;
    transition: transform .15s ease-out;
  }
  .colibri-marker.flying .wing-group {
    animation: wingBeat 0.15s infinite alternate ease-in-out;
  }
  .colibri-marker.landed .wing-group {
    animation: none;
    transform: rotate(20deg) scale(0.9, 0.65);
  }
  .colibri-marker.landed .colibri-stage {
    animation: colibriFloat 2.4s infinite ease-in-out;
  }
  @keyframes wingBeat {
    0% { transform: rotate(-25deg); }
    100% { transform: rotate(25deg); }
  }
  @keyframes colibriFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* --- Panel de Información Compacto (NO INVASIVO: 310px, Esquina Superior Derecha) --- */
  #panel {
    position: absolute;
    top: 76px;
    right: 18px;
    width: min(280px, calc(100vw - 36px));
    z-index: 50;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 48px -10px rgba(0,0,0,0.55);
    opacity: 0;
    transform: translateY(-15px) scale(0.96);
    pointer-events: none;
    transition: opacity .3s cubic-bezier(0.16, 1, 0.3, 1), transform .3s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1.5px solid rgba(197, 160, 89, 0.5);
  }
  #panel.on {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .panel-header-mini {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px;
    border-bottom: 1px solid rgba(15, 61, 42, 0.08);
  }
  .panel-thumb-box {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #FFFDF8;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1.5px solid var(--gold);
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  .panel-thumb-box .landmark-3d-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: scale(1.18);
  }
  .panel-title-wrap {
    flex: 1;
    margin-left: 10px;
  }
  .panel-cat-chip {
    font-size: 8.5px;
    font-weight: 800;
    color: var(--or);
    text-transform: uppercase;
    letter-spacing: .06em;
    display: block;
  }
  .panel-name {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--g);
    margin: 1px 0 0 0;
    line-height: 1.2;
  }
  .panel-close-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--mut);
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .panel-close-btn:hover { background: rgba(0,0,0,0.06); color: var(--ink); }

  .panel-body-mini {
    padding: 8px 12px 12px;
  }
  .panel-imgs-strip {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    margin-bottom: 8px;
    scrollbar-width: none;
  }
  .panel-imgs-strip::-webkit-scrollbar { display: none; }
  .panel-imgs-strip img {
    width: 76px;
    height: 50px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .panel-desc-mini {
    font-size: 11px;
    line-height: 1.45;
    color: var(--mut);
    margin-bottom: 8px;
  }
  .panel-meta-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }
  .meta-chip {
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: #FAF8F4;
    border: 1px solid #E6DEC8;
    color: var(--g);
  }
  .panel-actions-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }
  .mini-act-btn {
    font-size: 11px;
    font-weight: 700;
    padding: 7px 4px;
    border-radius: 8px;
    text-align: center;
    text-decoration: none;
    display: block;
    cursor: pointer;
    border: none;
    transition: all .2s;
  }
  .mini-act-btn.wp {
    grid-column: span 2;
    background: #25D366;
    color: #fff;
    font-size: 12px;
    padding: 9px 4px;
    box-shadow: 0 3px 10px rgba(37, 211, 102, 0.3);
  }
  .mini-act-btn.wp:hover { filter: brightness(0.95); }
  .mini-act-btn.gps {
    background: var(--or);
    color: #fff;
    box-shadow: 0 3px 10px rgba(232, 131, 12, 0.3);
  }
  .mini-act-btn.replay {
    background: #FAF8F4;
    border: 1px solid #D6D0C2;
    color: var(--g);
  }
  .mini-act-btn.replay:hover {
    background: #F0ECE1;
  }
  .mini-act-btn.refly {
    grid-column: span 2;
    background: transparent;
    border: 1px dashed #C9C2B2;
    color: var(--mut);
    font-size: 10.5px;
  }
  .mini-act-btn.refly:hover {
    border-color: var(--or);
    color: var(--or);
    background: rgba(232, 131, 12, 0.06);
  }

  /* Barra de Navegación Secuencial del Recorrido */
  .panel-nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #FAF8F4;
    border-top: 1px solid rgba(15, 61, 42, 0.08);
    padding: 7px 12px;
  }
  .nav-stop-btn {
    background: #fff;
    border: 1px solid #D6D0C2;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    color: var(--g);
    padding: 5px 10px;
    cursor: pointer;
    transition: all .2s;
  }
  .nav-stop-btn:hover:not(:disabled) {
    background: var(--g);
    color: #fff;
    border-color: var(--g);
  }
  .nav-stop-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    background: #F4F1EA;
    color: #A39D8F;
  }
  .nav-stop-counter {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--mut);
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  /* Tirador ergonómico para Bottom Sheet Móvil */
  .sheet-drag-handle {
    display: none;
    width: 44px;
    height: 5px;
    background: rgba(15, 61, 42, 0.22);
    border-radius: 999px;
    margin: 8px auto 2px;
    cursor: pointer;
    transition: background .2s, transform .2s;
  }
  .sheet-drag-handle:hover {
    background: var(--or);
    transform: scaleX(1.15);
  }

  /* Estado de vuelo flotante y subtítulos narrados */
  #status {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 61, 42, 0.94);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 8px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12.5px;
    z-index: 35;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
  }
  #status.speaking {
    background: rgba(11, 26, 18, 0.96);
    border-color: #FFC61A;
    max-width: min(460px, calc(100vw - 32px));
    text-align: left;
    padding: 9px 16px;
    border-radius: 16px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.65);
  }
  .speech-indicator {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .speech-wave {
    width: 3px;
    height: 12px;
    background: #FFC61A;
    border-radius: 2px;
    animation: soundWave 0.8s infinite ease-in-out alternate;
  }
  .speech-wave:nth-child(2) { animation-delay: 0.2s; height: 16px; }
  .speech-wave:nth-child(3) { animation-delay: 0.4s; height: 10px; }
  @keyframes soundWave {
    0% { transform: scaleY(0.4); opacity: 0.5; }
    100% { transform: scaleY(1.3); opacity: 1; }
  }
  .speech-caption-text {
    font-size: 11.5px;
    line-height: 1.35;
    color: #FFFDF8;
    font-weight: 600;
  }
  #status.on {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .flight-pulse {
    width: 8px;
    height: 8px;
    background: #FFC61A;
    border-radius: 50%;
    animation: flightBlink 0.8s infinite alternate;
  }
  @keyframes flightBlink {
    0% { opacity: 0.4; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.3); }
  }

  /* Antigravity: responsive movil/tablet (fusionado) */
  @media (max-width: 820px) {
    #bar {
      top: 10px;
      left: 10px;

// Diagnóstico y depuración con parámetro URL (?debug=1)
const urlParams = new URLSearchParams(window.location.search);
const isDebugMode = urlParams.get("debug") === "1";

function initDebugHUD() {
  if (!isDebugMode) return;
  const hud = document.createElement("div");
  hud.id = "debugHUD";
  hud.style.cssText = "position:fixed;top:14px;left:14px;z-index:999999;background:rgba(11,26,18,0.95);border:1.5px solid #FFC61A;border-radius:12px;padding:12px 14px;color:#FAF8F4;font-family:'Plus Jakarta Sans',monospace,sans-serif;font-size:11px;max-width:320px;max-height:80vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.7);line-height:1.4;pointer-events:auto;";
  hud.innerHTML = `
    <div style="font-weight:bold;color:#FFC61A;border-bottom:1px solid rgba(255,198,26,0.3);padding-bottom:4px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
      <span>🛠️ DIAGNÓSTICO MANAURE 3D</span>
      <span id="debugHudTimer" style="font-size:10px;color:#A9DFBF;">0s</span>
    </div>
    <div style="margin-bottom:4px;"><strong style="color:#FFD700;">Estado:</strong> <span id="debugHudStatus" style="color:#2ECC71;">Iniciando Mapbox GL...</span></div>
    <div style="margin-bottom:4px;"><strong style="color:#FFD700;">Aliados:</strong> <span id="debugHudAllies" style="color:#FAF8F4;">0 / 10</span></div>
    <div style="font-weight:bold;color:#FFD700;margin-top:6px;margin-bottom:2px;">Eventos & Logs:</div>
    <div id="debugHudLogs" style="font-size:10px;color:#A9DFBF;display:flex;flex-direction:column;gap:2px;max-height:160px;overflow-y:auto;background:rgba(0,0,0,0.3);padding:4px;border-radius:6px;"></div>
  `;
  document.body.appendChild(hud);

  let seconds = 0;
  setInterval(() => {
    seconds++;
    const t = document.getElementById("debugHudTimer");
    if (t) t.textContent = `${seconds}s`;
  }, 1000);
}

function logDebug(msg, isError = false) {
  if (!isDebugMode) return;
  const logs = document.getElementById("debugHudLogs");
  if (logs) {
    const item = document.createElement("div");
    item.style.color = isError ? "#FF6B6B" : "#A9DFBF";
    item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logs.appendChild(item);
    logs.scrollTop = logs.scrollHeight;
  }
}

// Pantalla de contingencia visible si falla el mapa o token (nunca dejar fondo verde vacío)
function mostrarFalloMapa(msg) {
  try {
    const existing = document.getElementById("mapaErrorOverlay");
    if (existing) return;
    const d = document.createElement("div");
    d.id = "mapaErrorOverlay";
    d.setAttribute("role", "alert");
    d.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:radial-gradient(circle at center, #132E20 0%, #0B1A12 100%);color:#fff;padding:28px;text-align:center;font-family:'Plus Jakarta Sans',sans-serif;";
    d.innerHTML = `
      <div style="font-size:48px;line-height:1;margin-bottom:4px;">🗺️</div>
      <h2 style="font-family:'Fraunces',serif;font-size:24px;color:#FFC61A;margin:0;">No se pudo cargar el mapa 3D</h2>
      <p style="font-size:14px;color:#FAF8F4;max-width:440px;line-height:1.6;margin:0;opacity:0.9;">${msg}</p>
      <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;justify-content:center;">
        <button onclick="location.reload()" style="background:#E8830C;color:#fff;border:none;border-radius:999px;padding:12px 26px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 4px 15px rgba(232,131,12,0.4);transition:transform 0.2s;">
          🔄 Recargar página
        </button>
        <a href="../index.html" style="background:transparent;color:#FAF8F4;border:1.5px solid rgba(255,255,255,0.3);border-radius:999px;padding:12px 22px;font-weight:600;font-size:13.5px;text-decoration:none;">
          ← Volver al Brochure
        </a>
      </div>
    `;
    const mapContainer = document.getElementById("map") || document.body;
    mapContainer.appendChild(d);
    logDebug(`[FALLO CRÍTICO] ${msg}`, true);
    if (isDebugMode) {
      const s = document.getElementById("debugHudStatus");
      if (s) { s.textContent = "Error al cargar mapa"; s.style.color = "#FF6B6B"; }
    }
  } catch (e) {
    console.error("Error mostrando pantalla de fallo:", e);
  }
}

// Iniciar HUD de diagnóstico inmediatamente si ?debug=1
initDebugHUD();
logDebug("Modo diagnóstico activado.");

// Control global de errores para que ningún fallo futuro sea silencioso
window.onerror = function(msg, url, lineNo, colNo, error) {
  const errText = `⚠️ Error: ${msg} (Línea ${lineNo})`;
  console.error(errText, error);
  logDebug(errText, true);
  const statusEl = document.getElementById("status");
  if (statusEl) {
    statusEl.innerHTML = `<span>${errText}</span>`;
    statusEl.classList.add("on");
    statusEl.style.color = "#FFD700";
    statusEl.style.borderColor = "#E74C3C";
  }
  return false;
};

function validarAliado(s) {
  if (!s || typeof s !== "object") {
    console.error("[Manaure 3D] ⚠️ Registro de aliado nulo o no válido");
    logDebug("⚠️ Aliado nulo o no válido", true);
    return false;
  }
  if (typeof s.lat !== "number" || typeof s.lng !== "number" || isNaN(s.lat) || isNaN(s.lng)) {
    console.error(`[Manaure 3D] ⚠️ Aliado "${s.id || 'desconocido'}" tiene coordenadas no numéricas o NaN: lat=${s.lat}, lng=${s.lng}`);
    logDebug(`⚠️ Coordenadas inválidas en "${s.id}": lat=${s.lat}, lng=${s.lng}`, true);
    return false;
  }
  if (s.lat === 0 && s.lng === 0) {
    console.error(`[Manaure 3D] ⚠️ Aliado "${s.id}" tiene coordenadas 0,0 (nulas)`);
    logDebug(`⚠️ Coordenadas (0,0) en "${s.id}"`, true);
    return false;
  }
  // Coordenadas invertidas o fuera del cuadrante regional de Manaure, Cesar
  if (s.lat < 0 || s.lng > 0) {
    console.error(`[Manaure 3D] ⚠️ Aliado "${s.id}" tiene coordenadas invertidas o signo incorrecto: lat=${s.lat}, lng=${s.lng}`);
    logDebug(`⚠️ Coordenadas invertidas en "${s.id}": lat=${s.lat}, lng=${s.lng}`, true);
    return false;
  }
  // Cuadrante estricto de Manaure Balcón del Cesar y Serranía del Perijá (lat: 10.0 a 10.6, lng: -73.3 a -72.7)
  if (s.lat < 10.0 || s.lat > 10.6 || s.lng < -73.3 || s.lng > -72.7) {
    console.error(`[Manaure 3D] ⚠️ Aliado "${s.id}" está fuera del área geográfica de Manaure: lat=${s.lat}, lng=${s.lng}`);
    logDebug(`⚠️ Aliado "${s.id}" fuera de Manaure: [${s.lng}, ${s.lat}]`, true);
    return false;
  }
  return true;
}

function getBoundsTodos() {
  const validStops = Object.values(STOPS).filter(validarAliado);
  const minLng = Math.min(...validStops.map(s => s.lng));
  const maxLng = Math.max(...validStops.map(s => s.lng));
  const minLat = Math.min(...validStops.map(s => s.lat));
  const maxLat = Math.max(...validStops.map(s => s.lat));
  return [[minLng, minLat], [maxLng, maxLat]];
}

function actualizarColisionesEtiquetas() {
  if (!map || !map.loaded()) return;
  const zoom = map.getZoom();
  const width = window.innerWidth;
  const height = window.innerHeight;
  const screenCenter = { x: width / 2, y: height / 2 };

  // 1. Zoom < 12.0: Serranía completa, ocultar etiquetas para evitar amontonamiento
  if (zoom < 12.0) {
    document.body.classList.add("compacto");
    Object.values(markerElements).forEach(el => {
      const isSelected = el.classList.contains("active");
      el.classList.toggle("badge-collapsed", !isSelected);
      el.classList.remove("edge-left", "edge-right", "edge-top");
    });
    return;
  }

  document.body.classList.remove("compacto");

  // 2. Calcular posiciones en pantalla de cada aliado activo
  const markerPositions = [];
  Object.entries(STOPS).forEach(([id, s]) => {
    const el = markerElements[id];
    if (!el) return;
    try {
      const p = map.project([s.lng, s.lat]);
      const distToCenter = Math.hypot(p.x - screenCenter.x, p.y - screenCenter.y);
      markerPositions.push({
        id,
        el,
        x: p.x,
        y: p.y,
        distToCenter,
        isActive: currentSelectedStop && currentSelectedStop.id === id
      });
    } catch(e) {}
  });

  // 3. Ajuste de bordes (clamping) para no salirse de pantalla
  markerPositions.forEach(item => {
    item.el.classList.toggle("edge-left", item.x < 75);
    item.el.classList.toggle("edge-right", item.x > width - 75);
    item.el.classList.toggle("edge-top", item.y < 90);
  });

  // 4. Detección de colisiones (distancia mínima de 88px en pantalla)
  const COLLISION_THRESHOLD = 88;
  const collapsedSet = new Set();

  for (let i = 0; i < markerPositions.length; i++) {
    for (let j = i + 1; j < markerPositions.length; j++) {
      const m1 = markerPositions[i];
      const m2 = markerPositions[j];
      const dist = Math.hypot(m1.x - m2.x, m1.y - m2.y);

      if (dist < COLLISION_THRESHOLD) {
        if (m1.isActive) {
          collapsedSet.add(m2.id);
        } else if (m2.isActive) {
          collapsedSet.add(m1.id);
        } else if (m1.distToCenter <= m2.distToCenter) {
          collapsedSet.add(m2.id);
        } else {
          collapsedSet.add(m1.id);
        }
      }
    }
  }

  markerPositions.forEach(item => {
    const shouldCollapse = collapsedSet.has(item.id) && !item.isActive;
    item.el.classList.toggle("badge-collapsed", shouldCollapse);
  });
}

}

function hablar(texto){
  // Subtítulos flotantes sincronizados y onda de voz (Mejora UX 3)
  if ($status) {
    $status.classList.add("speaking", "on");
    $status.innerHTML = `
      <div class="speech-indicator">

        <span class="speech-wave"></span>
      </div>
      <div class="speech-caption-text"><strong>🎙️ Colibrí:</strong> ${texto}</div>
    `;
  }

  if (!voiceChk.checked || !("speechSynthesis" in window)) {
    // Si la voz está desactivada, mostrar subtítulo durante 4.5 segundos y luego ocultar
    setTimeout(() => {
      if ($status && $status.classList.contains("speaking")) {
        $status.classList.remove("speaking", "on");
      }
    }, 4500);
    return Promise.resolve();
  }

  speechSynthesis.cancel();
  let timerId = null;

  const cleanupSpeech = () => {
    if (timerId) clearTimeout(timerId);
    setTimeout(() => {
      if ($status && $status.classList.contains("speaking")) {
        $status.classList.remove("speaking", "on");
      }
    }, 1800);
  };

  const speakPromise = new Promise(resolve => {
    try {
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = "es-CO";
      u.rate = 0.95;
      u.pitch = 1.05;
      u.onend = () => {
        cleanupSpeech();
        resolve();
      };
      u.onerror = () => {
        cleanupSpeech();
        resolve();
      };
      speechSynthesis.speak(u);
    } catch(e) {
      cleanupSpeech();
      resolve();
    }
  });

  // Tarea 1: Timeout de seguridad máximo 25s para evitar promesas colgadas
  const timeoutPromise = new Promise(resolve => {
    timerId = setTimeout(() => {
      try {
        if ("speechSynthesis" in window) speechSynthesis.cancel();
      } catch(e) {}
      cleanupSpeech();
      resolve();
    }, 25000);
  });

  return Promise.race([speakPromise, timeoutPromise]);
}

function getStreetPath(fromId, toId, fromCoords, toCoords) {
  const key = `${fromId}->${toId}`;
  const cache = PRECOMPUTED_ROUTES[key];
  const TOL_DEG = 0.02; // ~2.2 km: acepta finales de carretera (ej. páramo) pero descarta cachés ajenos
  const cerca = (a, b) => Math.hypot(a.lng - b.lng, a.lat - b.lat) < TOL_DEG;
  const puntoOk = (q) => q && Number.isFinite(q.lng) && Number.isFinite(q.lat);
  if (puntoOk(fromCoords) && puntoOk(toCoords) && cache && cache.length > 1 &&
      cerca(cache[0], fromCoords) && cerca(cache[cache.length - 1], toCoords) &&
      cache.every(puntoOk)) {
    // Costura: el primer punto es la posición REAL del pájaro y el último el destino.
    // Así el colibrí JAMÁS se teletransporta ni vuela por zonas ajenas a la ruta.
    return [{ lng: fromCoords.lng, lat: fromCoords.lat },
      ...cache,
      { lng: toCoords.lng, lat: toCoords.lat }];
  }
  // Curva escénica suave si no está en caché
  const N = 60, pts = [];
  const mx = (fromCoords.lng + toCoords.lng)/2, my = (fromCoords.lat + toCoords.lat)/2;
  const dx = toCoords.lng - fromCoords.lng, dy = toCoords.lat - fromCoords.lat;
  const len = Math.hypot(dx, dy) || 0.001;
  const off = len * 0.2;
  const cx = mx - dy/len*off, cy = my + dx/len*off;
  for (let i = 0; i <= N; i++) {
    const t = i / N, u = 1 - t;
    pts.push({
      lng: u*u*fromCoords.lng + 2*u*t*cx + t*t*toCoords.lng,
      lat: u*u*fromCoords.lat + 2*u*t*cy + t*t*toCoords.lat
    });
  }
  return pts;
}

function posEnRuta(path, t){
  t = Math.min(1, Math.max(0, t)); // blindaje: t siempre en [0,1], jamás índice -1
  const f = t * (path.length - 1), i = Math.floor(f), u = f - i;
  const a = path[i], b = path[Math.min(i + 1, path.length - 1)];
  return { lng: a.lng + (b.lng - a.lng) * u, lat: a.lat + (b.lat - a.lat) * u };
}

function calcBearing(a, b) {
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const y = Math.sin(dLng) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function volar(fromStop, toStop){
  return new Promise((resolve) => {
    const fromCoords = colibri ? { lng: colibri.getLngLat().lng, lat: colibri.getLngLat().lat } : { lng: fromStop.lng, lat: fromStop.lat };
    const toCoords = { lng: toStop.lng, lat: toStop.lat };
    const km = dist(fromCoords, toCoords);
    if (!Number.isFinite(km)) { // coordenadas inválidas: no despegar a ciegas
      setStatus(`⚠️ Sin coordenadas válidas para volar a ${toStop.short}`);
      resolve(false);
      return;
    }

    // Duración de vuelo adecuada: visible y lenta para apreciar calles y edificios 3D
    // Vuelo SIEMPRE animado (nunca teletransporte): hasta los saltos <300 m vuelan 2.5 s
    const dur = km < 0.3 ? 2500 : Math.min(Math.max(9000, 7500 + km * 2200), 22000);

    setStatus(`Colibrí volando por las calles hacia: ${toStop.short}…`);
    const path = getStreetPath(fromStop.id || "villa", toStop.id, fromCoords, toCoords);

    colibri.setOffset([0, -10]);
    colibriEl.classList.remove("landed");
    colibriEl.classList.add("flying");
    traerColibriAlFrente();

    // Dibujar ruta iluminada sobre las calles
    try {
      const fullCoords = path.map(p => [p.lng, p.lat]);
      map.getSource("active-route-line").setData({
        type: "Feature",
        geometry: { type: "LineString", coordinates: fullCoords }
      });
    } catch(e) {}

    const zoomDestino = toStop.zoom || 16.8;
    const bearingInicio = map.getBearing();
    const miToken = animToken;

    let curCamBearing = bearingInicio;

    // --- Cámara cinematográfica: el pájaro CRUZA la pantalla, no va pegado al centro ---
    // Fase 1 despegue → Fase 2 se ve TODA la ruta y el colibrí la recorre por las calles
    // → Fase 3 la cámara baja al destino y el pájaro aterriza y PARA.
    const vistaInicio = { centro: map.getCenter().toArray(), zoom: map.getZoom() };
    let vistaRuta;
    try {
      const lngs = path.map(pt => pt.lng), lats = path.map(pt => pt.lat);
      const cam = map.cameraForBounds(
        [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
        { padding: 90 }
      );
      vistaRuta = { centro: [cam.center.lng, cam.center.lat], zoom: Math.min(Math.max(cam.zoom, 10.5), 14.5) };
    } catch (e) {
      vistaRuta = { centro: [(fromCoords.lng + toCoords.lng) / 2, (fromCoords.lat + toCoords.lat) / 2], zoom: 12.5 };
    }
    const vistaFin = { centro: [toCoords.lng, toCoords.lat], zoom: zoomDestino };
    let acumulado = 0, ultimoT = performance.now();
    let terminado = false;
    let ultimoPct = -1;
    let pDiag = -1;

    async function terminar(){
      if (terminado) return;
      terminado = true;
      try {
        colibriEl.classList.remove("flying");
        colibriEl.classList.add("landed");
        // Se posa sobre su marcador: GPS exacto al pin, dibujo flotando arriba
        colibri.setLngLat([toStop.lng, toStop.lat]);
        colibri.setOffset([26, -72]);
        traerColibriAlFrente();

        // Clavar la cámara en el punto con moveend antes de dar por finalizado el vuelo
        await new Promise((resMove) => {
          let finished = false;
          const onMoveEnd = () => {
            if (finished) return;
            finished = true;
            map.off("moveend", onMoveEnd);
            resMove();
          };
          map.once("moveend", onMoveEnd);
          map.flyTo({
            center: [toStop.lng, toStop.lat],
            padding: getCameraPadding(),
            zoom: zoomDestino,
            pitch: 45,
            bearing: curCamBearing || -10,
            speed: 0.9,
            curve: 1.2
          });
          setTimeout(onMoveEnd, 2800); // timeout de seguridad
        });
      } catch (err) {
        console.error("Error al terminar vuelo:", err);
      } finally {
        resolve(true); // true = aterrizó de verdad con cámara fija
      }
    }

    function frame(ahora){
      if (miToken !== animToken) {
        if (!terminado) { terminado = true; resolve(false); } // cancelado: avisa, no aterriza
        return;
      }
      if (terminado) return;
      if (paused) { ultimoT = ahora; requestAnimationFrame(frame); return; }

      try {
        const dtFrame = Math.min(Math.max(ahora - ultimoT, 0), 50); // 0..50ms: ni relojes invertidos ni saltos teletransportan
        acumulado += dtFrame; ultimoT = ahora;
        const p = Math.min(1, acumulado / dur);
        pDiag = p;
        const pct5 = Math.floor(p * 20);
        if (pct5 !== ultimoPct) {
          ultimoPct = pct5;
          setStatus(`Volando a ${toStop.short} · ${pct5 * 5}% (${km.toFixed(1)} km por calles)…`);
        }
        
        // Suavizado in-out cúbico
        const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

        const pos = posEnRuta(path, ease);
        colibri.setLngLat([pos.lng, pos.lat]);
        traerColibriAlFrente();

        // Dirección de la calle para orientar la vista hacia adelante
        const posAhead = posEnRuta(path, Math.min(1, ease + 0.04));
        const roadBearing = calcBearing(pos, posAhead);

        const guiaChk = document.getElementById("guiaChk");
        const guiaActiva = guiaChk ? guiaChk.checked : true;

        if (guiaActiva) {
          // TAREA 3 — Modo guía estilo Google Maps:
          // Suavizado continuo de rotación para evitar saltos en esquinas
          let dDeg = (roadBearing - curCamBearing) % 360;
          if (dDeg > 180) dDeg -= 360;
          if (dDeg < -180) dDeg += 360;
          curCamBearing += dDeg * 0.22;

          const rad = curCamBearing * (Math.PI / 180);
          const leadDist = 0.00018; // ~20 metros adelante del colibrí
          const camCentro = [
            pos.lng + Math.sin(rad) * leadDist,
            pos.lat + Math.cos(rad) * leadDist
          ];
          // Zoom por fases (igual que modo normal): el pájaro nunca sale del encuadre,
          // ni siquiera en rutas largas donde antes parecía teletransportarse
          let camZoomG;
          if (p < 0.15) {
            const t = p / 0.15, s = t * t * (3 - 2 * t);
            camZoomG = vistaInicio.zoom + (vistaRuta.zoom - vistaInicio.zoom) * s;
          } else if (p < 0.75) {
            camZoomG = vistaRuta.zoom;
          } else {
            const t = (p - 0.75) / 0.25, s = t * t * (3 - 2 * t);
            camZoomG = vistaRuta.zoom + (vistaFin.zoom - vistaRuta.zoom) * s;
          }

          map.jumpTo({
            center: camCentro,
            zoom: camZoomG,
            pitch: 58,
            bearing: curCamBearing
          });
        } else {
          // Con vista guía inactiva, conserva las fases actuales (despegue/ruta/destino)
          const blendedBearing = bearingInicio + (roadBearing - bearingInicio) * 0.25;
          let camCentro, camZoom;
          if (p < 0.15) {
            const t = p / 0.15, s = t * t * (3 - 2 * t);
            camCentro = [vistaInicio.centro[0] + (vistaRuta.centro[0] - vistaInicio.centro[0]) * s,
                         vistaInicio.centro[1] + (vistaRuta.centro[1] - vistaInicio.centro[1]) * s];
            camZoom = vistaInicio.zoom + (vistaRuta.zoom - vistaInicio.zoom) * s;
          } else if (p < 0.75) {
            camCentro = vistaRuta.centro; // ruta completa a la vista: el colibrí la cruza por las calles
            camZoom = vistaRuta.zoom;
          } else {
            const t = (p - 0.75) / 0.25, s = t * t * (3 - 2 * t);
            camCentro = [vistaRuta.centro[0] + (vistaFin.centro[0] - vistaRuta.centro[0]) * s,
                         vistaRuta.centro[1] + (vistaFin.centro[1] - vistaRuta.centro[1]) * s];
            camZoom = vistaRuta.zoom + (vistaFin.zoom - vistaRuta.zoom) * s;
          }

          map.jumpTo({
            center: camCentro,
            zoom: camZoom,
            pitch: 56,
            bearing: blendedBearing
          });
        }

        if (p < 1) {
          requestAnimationFrame(frame);
          return;
        }
        terminar();
      } catch (err) {
        console.error("Error en animación frame():", err);
        if (!terminado) { // error real: NO saltar al destino, mostrarlo y quedarse quieto
          terminado = true;
          setStatus(`⚠️ No pudo volar ${fromStop.short}→${toStop.short} [p=${pDiag} n=${path.length} km=${Number.isFinite(km) ? km.toFixed(2) : 'NaN'}]: ${err && err.message ? err.message : err}`);
          resolve(false);
        }
      }
    }

    requestAnimationFrame(frame);
  });
}

// Selección manual inmediata al pulsar cualquier marcador o punto
async function seleccionarDestino(id) {
  const s = STOPS[id];
  if (!s) return;
  const miSelToken = ++animToken;
  paused = false;
  btnStart.disabled = false;
  btnPause.disabled = true;
  btnStop.disabled = true;
  sel.disabled = false;
  btnPause.textContent = "⏸ Pausar";
  if ("speechSynthesis" in window) speechSynthesis.cancel();

  if (!map.loaded()) { // mapa aún cargando: esperar (si no, el vuelo muere al nacer)
    setStatus("Cargando mapa 3D, espera un momento…");
    await new Promise((res) => { map.once("load", res); setTimeout(res, 8000); });
    if (miSelToken !== animToken) return;
  }

  const prev = currentSelectedStop || firstStop;
  if (prev && prev.id === s.id && colibriEl.classList.contains("landed")) {
    map.flyTo({
      center: [s.lng, s.lat],
      padding: getCameraPadding(),
      zoom: s.zoom || 16.8,
      pitch: 45,
      speed: 0.8
    });
    colibri.setOffset([26, -72]);
    traerColibriAlFrente();
    showPanel(s);
    await hablar(`${s.name}. ${s.text}`);
    return;
  }

  setStatus(`Colibrí iniciando vuelo hacia: ${s.short}…`);
  const llego = await volar(prev, s);

  if (miSelToken !== animToken) return;
  if (!llego) return; // vuelo interrumpido o fallido: no mostrar llegada falsa

  const guiaChk = document.getElementById("guiaChk");
  const guiaActiva = guiaChk ? guiaChk.checked : true;
  setStatus(guiaActiva ? `Has llegado a ${s.short}` : `Posado en: ${s.short}`);
  showPanel(s);
  await hablar(`${s.name}. ${s.text}`);
}

// Recorrido guiado paso a paso por los aliados
async function recorrer(ids){
  const curToken = ++animToken;
  btnStart.disabled = true;
  btnPause.disabled = false;
  btnStop.disabled = false;
  sel.disabled = true;

  try {
    let prev = currentSelectedStop || firstStop;

    for (const id of ids){
      if (curToken !== animToken) return;
      const s = STOPS[id];
      if (!s) continue;

      await volar(prev, s);
      prev = s;
      if (curToken !== animToken) return;

      const guiaChk = document.getElementById("guiaChk");
      const guiaActiva = guiaChk ? guiaChk.checked : true;
      setStatus(guiaActiva ? `Has llegado a ${s.short}` : `Posado en: ${s.short}`);
      showPanel(s);
      await hablar(`${s.name}. ${s.text}`);
      if (curToken !== animToken) return;

      await sleep(3500);
    }

    setStatus("Recorrido completado con éxito");
    setTimeout(() => setStatus(""), 4000);
  } finally {
    btnStart.disabled = false;
    btnPause.disabled = true;
    btnStop.disabled = true;
    sel.disabled = false;
  }
}

/* =========================================================================
   6) CONSTRUCCIÓN DE MARCADORES ANTI-SOLAPAMIENTO Y CLIC INMEDIATO
   ========================================================================= */
function buildMarkerElement(s) {
  const el = document.createElement("div");
  el.className = "landmark-marker";
  el.id = `marker-${s.id}`;
  el.setAttribute("data-id", s.id);

  const catLabel = s.catTag || (s.cat ? s.cat.split(",")[0].split("·")[0].trim() : "Turismo");
  const titleLabel = s.short || s.name;
  const iconFile = s.icon || (typeof CATEGORY_ICONS_3D !== "undefined" ? CATEGORY_ICONS_3D[s.id] : null) || "hospedaje.png";

  el.innerHTML = `
    <div class="landmark-badge-card">
      <div class="landmark-labels">
        <span class="landmark-sub">${catLabel}</span>
        <span class="landmark-title">${titleLabel}</span>
      </div>
    </div>
    <div class="landmark-diorama-stage">
      <img src="../assets/iconos-3d/${iconFile}" class="landmark-diorama-model" alt="${titleLabel}" onerror="console.warn('⚠️ Ícono no cargó para aliado:', '${s.id}', this.src); this.src='../assets/iconos-3d/hospedaje.png';">
      <div class="landmark-ground-shadow"></div>
      <div class="landmark-anchor-ring"></div>
    </div>
  `;

  // Detección de arrastre: si el usuario está arrastrando el mapa con el cursor, no disparar selección
  let startX = 0, startY = 0, isDragging = false;
  el.addEventListener("mousedown", (e) => {
    startX = e.clientX;
    startY = e.clientY;
    isDragging = false;
  });
  el.addEventListener("mousemove", (e) => {
    if (Math.hypot(e.clientX - startX, e.clientY - startY) > 5) {
      isDragging = true;
    }
  });
  el.addEventListener("click", (evt) => {
    evt.stopPropagation();
    if (isDragging) return;
    seleccionarDestino(s.id);
  });

  return el;
}

let markersCreated = false;
function initMarkers() {
  if (markersCreated) return;
  markersCreated = true;

  let aliadosMontados = 0;
  let aliadosFallidos = 0;

  Object.values(STOPS).forEach(s => {
    try {
      if (!validarAliado(s)) {
        aliadosFallidos++;
        console.error(`[Manaure 3D] Marcador omitido: validación falló para aliado "${s ? s.id : 'desconocido'}"`);
        logDebug(`⚠️ Aliado descartado por validación: ${s ? (s.short || s.id) : 'nulo'}`, true);
        return;
      }
      const el = buildMarkerElement(s);
      markerElements[s.id] = el;
      new mapboxgl.Marker({ element: el, anchor: "bottom" })
        .setLngLat([s.lng, s.lat])
        .addTo(map);
      aliadosMontados++;
      logDebug(`✓ Montado: ${s.short || s.name}`);
    } catch (err) {
      aliadosFallidos++;
      console.error(`[Manaure 3D] Error crítico al montar marcador del aliado "${s ? s.id : 'desconocido'}":`, err);
      logDebug(`❌ Error al montar "${s ? s.id : 'desconocido'}": ${err.message}`, true);
    }
  });

  const resText = `${aliadosMontados}/10 aliados activos montados`;
  logDebug(`Resumen marcadores: ${resText}. Fallidos: ${aliadosFallidos}`);
  if (isDebugMode) {
    const elAllies = document.getElementById("debugHudAllies");
    if (elAllies) elAllies.textContent = resText;
  }
  traerColibriAlFrente();
}

/* =========================================================================
   7) CONFIGURACIÓN DE CAPAS 3D (DEM, FOG, DIORAMA Y RUTAS)
   ========================================================================= */
function setup3DLayers() {
  if (map.getSource("mapbox-dem")) return;

  // Relieve 3D de la Serranía del Perijá
  try {
    map.addSource("mapbox-dem", {
      type: "raster-dem",
      url: "mapbox://mapbox.mapbox-terrain-dem-v1",
      tileSize: 512,
      maxzoom: 14
    });
    map.setTerrain({ source: "mapbox-dem", exaggeration: 1.65 });
  } catch(e) {}

  // Cielo y atmósfera dorada de la Serranía
  try {
    map.setFog({
      range: [0.8, 8],
      color: '#E8F5E9',
      'horizon-blend': 0.15,
      'high-color': '#C8E6C9',
      'space-color': '#1B3D28'
    });
  } catch(e) {}


  // Capa de Línea de Vuelo Luminous sobre las Calles
  try {
    if (!map.getSource("active-route-line")) {
      map.addSource("active-route-line", {
        type: "geojson",
        data: {
          type: "Feature",
          geometry: { type: "LineString", coordinates: [] }
        }
      });
      map.addLayer({
        id: "route-glow",
        type: "line",
        source: "active-route-line",
        paint: {
          "line-color": "#E8830C",
          "line-width": 6,
          "line-opacity": 0.85,
          "line-blur": 2
        }
      });
      map.addLayer({
        id: "route-core",
        type: "line",
        source: "active-route-line",
        paint: {
          "line-color": "#FFF5EE",
          "line-width": 3,
          "line-opacity": 0.95
        }
      });
    }
  } catch(e) {}
}

/* =========================================================================
   8) EVENT LISTENERS Y ARRANQUE
   ========================================================================= */
// Solo NUESTROS marcadores: oculta los pines genéricos del mapa base
// (ej. el pin gris de La Casa de Vidrio) para que en cada sitio se vea
// la tarjeta + ícono 3D propio. Se re-aplica al cambiar de estilo/iluminación.
function ocultarPOIsGenericos() {
  try { map.setConfigProperty("basemap", "showPointOfInterestLabels", false); } catch(e) {}
  ["poi-label", "poi", "transit-label"].forEach((id) => {
    try { if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none"); } catch(e) {}
  });
}

function fitTodosLosConvenios(animated = true) {
  hidePanel();
  destDirectSel.value = "";
  highlightMarker(null);

  const bounds = getBoundsTodos();
  const fitOpts = {
    padding: { top: 90, bottom: 65, left: 65, right: 65 },
    maxZoom: 12.0,
    pitch: 35,
    bearing: -10
  };

  if (animated) {
    map.fitBounds(bounds, { ...fitOpts, speed: 0.9, curve: 1.3 });
  } else {
    map.fitBounds(bounds, { ...fitOpts, duration: 0 });
  }
}

map.on("style.load", () => {
  setup3DLayers();
  ocultarPOIsGenericos();
});

// BLINDAJE SENIOR: Todo lo que agrega capas, fuentes o marcadores se ejecuta dentro de map.on("load")
map.on("load", () => {
  mapLoaded = true;
  logDebug("Evento map.on('load') completado exitosamente.");
  if (isDebugMode) {
    const s = document.getElementById("debugHudStatus");
    if (s) { s.textContent = "Mapa cargado exitosamente (WebGL 3D activo)"; s.style.color = "#2ECC71"; }
  }

  // 1. Configuración de capas y terreno 3D
  setup3DLayers();
  ocultarPOIsGenericos();

  // 2. Montaje seguro de marcadores de aliados
  initMarkers();

  // 3. Montaje del colibrí narrador
  initColibri();

  // 4. Ajustes de densidad visual y encuadre inicial
  fitTodosLosConvenios(false);
  scheduleCollisionCheck();

  // Escuchadores continuos para prevención de colisiones en tiempo real
  map.on("move", scheduleCollisionCheck);
  map.on("zoom", scheduleCollisionCheck);
  map.on("resize", scheduleCollisionCheck);

  // 5. Soporte de enlace directo desde el brochure (?dest=cuatri o ?stop=arepas)
  const targetStop = urlParams.get("dest") || urlParams.get("stop");
  if (targetStop && STOPS[targetStop]) {
    setTimeout(() => {
      seleccionarDestino(targetStop);
    }, 1500);
  }
});

sel.onchange = async () => {
  const stops = (ROUTES[sel.value] && ROUTES[sel.value].stops) || [];
  const first = STOPS[stops[0]];
  if (!first) return;
  animToken++; // cancela vuelo/tour en curso
  paused = false;
  btnPause.textContent = "⏸ Pausar";
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  // Vuela al inicio de la ruta (nunca salta): el recorrido empieza donde se posa
  setStatus(`Volando al inicio de ruta: ${first.short}…`);
  const llegoRuta = await volar(currentSelectedStop || firstStop, first);
  if (!llegoRuta) return;
  showPanel(first);
  setStatus(`Inicio de ruta: ${first.short} · pulsa Iniciar Vuelo`);
};

};

btnPause.onclick = () => {
  paused = !paused;
  btnPause.textContent = paused ? "▶ Reanudar" : "⏸ Pausar";
  if ("speechSynthesis" in window) {
    if (paused) speechSynthesis.pause(); else speechSynthesis.resume();
  }
};

btnStop.onclick = () => {
  animToken++;
  paused = false;
  btnStart.disabled = false;
  btnPause.disabled = true;
  btnStop.disabled = true;
  sel.disabled = false;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  setStatus("Sobrevuelo detenido");
  setTimeout(() => setStatus(""), 2000);
  if (currentSelectedStop) {
    colibri.setLngLat([currentSelectedStop.lng, currentSelectedStop.lat]);
    colibri.setOffset([26, -72]);
    colibriEl.classList.remove("flying");
    colibriEl.classList.add("landed");
    traerColibriAlFrente();
  }
};
</script>
</body>
</html>
